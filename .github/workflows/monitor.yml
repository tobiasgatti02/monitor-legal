name: PJN Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

concurrency:
  group: pjn-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    strategy:
      matrix:
        user:
          - gatti
          - mazzarini
      max-parallel: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state_${{ matrix.user }}.json
          key: pjn-state-${{ matrix.user }}-${{ github.run_id }}
          restore-keys: |
            pjn-state-${{ matrix.user }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PJN monitor
        env:
          PJN_USER: ${{ secrets[format('PJN_USER_{0}', matrix.user)] || secrets.PJN_USER }}
          PJN_PASS: ${{ secrets[format('PJN_PASS_{0}', matrix.user)] || secrets.PJN_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_EMAIL: ${{ secrets[format('ALERT_EMAIL_{0}', matrix.user)] || 'Gattilegales@gmail.com' }}
          PJN_HEADLESS: 'true'
          PJN_TIMEOUT_MS: '45000'
          PJN_RETRIES: '2'
          PJN_STATE_PATH: state_${{ matrix.user }}.json
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python main.py

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pjn-state-${{ matrix.user }}-${{ github.run_id }}
          path: state_${{ matrix.user }}.json
          if-no-files-found: ignore
          retention-days: 7
