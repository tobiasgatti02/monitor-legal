name: PJN Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pjn-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PJN monitor
        env:
          PJN_USER: ${{ secrets.PJN_USER }}
          PJN_PASS: ${{ secrets.PJN_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_EMAIL: Gattilegales@gmail.com
          PJN_HEADLESS: 'true'
          PJN_TIMEOUT_MS: '45000'
          PJN_RETRIES: '2'
          PJN_STATE_PATH: state.json
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python main.py

      - name: Commit updated state.json
        if: success()
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json no cambió"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update PJN state [skip ci]"
          git push

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjn-state-${{ github.run_id }}
          path: state.json
          if-no-files-found: ignore
          retention-days: 7
